<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumni — AFCSC Jaji</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="stage">

  <!-- ============================ TIMELINE ============================ -->
  <section id="timeline" class="screen">

    <div class="bg-stack" id="bg-stack"></div>
    <div class="grain"></div>
    <div class="frame"><i></i><i></i><i></i><i></i></div>

    <header class="bar">
      <div class="brand">
        <img class="brand-mark" src="assets/img/logos/afcsc.jpg" alt="">
        <div>
          <div class="brand-top">Armed Forces Command and Staff College · Jaji</div>
          <div class="brand-name">Alumni</div>
        </div>
      </div>
      <nav class="chips" id="course-chips">
        <button class="chip is-on" data-course="all">All alumni</button>
        <button class="chip" data-course="jc">Junior Course</button>
        <button class="chip" data-course="sc">Senior Course</button>
      </nav>
      <button class="kiosk-close" id="close-app" aria-label="Close the kiosk" title="Close">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>

      <button class="nav-btn" id="nav-open" aria-label="Open chapters">
        <span class="nav-btn-lines"><i></i><i></i><i></i></span>
        <span>Chapters</span>
      </button>
    </header>

    <div class="track" id="track"></div>

    <footer class="rail" id="rail">
      <div class="rail-line"><i id="rail-fill"></i></div>
      <div class="rail-ticks" id="rail-ticks"></div>
      <div class="rail-note" id="rail-note"></div>
      <div class="rail-foot">
        <span class="rail-hint">Drag · arrows</span>
        <div class="rail-arrows">
          <button class="round" data-step="-1" aria-label="Earlier"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
          <button class="round" data-step="1" aria-label="Later"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
      </div>
    </footer>

    <div class="kiosk-hint" id="kiosk-hint">Press <b>Alt</b> + <b>F4</b> to close the kiosk</div>
  </section>

  <!-- ============================ NAV MODAL ============================ -->
  <section id="nav" class="screen is-hidden">
    <div class="nav-photo" id="nav-photo">
      <img class="np np-a is-on" src="assets/img/cards/hall.jpg" alt="">
      <img class="np np-b" alt="">
      <div class="nav-photo-cap"><span id="nav-photo-cap">The College · Jaji</span></div>
    </div>

    <div class="nav-list" id="nav-list">
      <div class="nav-head">Chapters</div>
    </div>

    <button class="nav-close" id="nav-close" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
    <div class="nav-foot">AFCSC · Department of Air Warfare · Hall of Fame</div>
  </section>

  <!-- ============================ GALLERY ============================ -->
  <section id="gallery" class="screen is-hidden">
    <header class="bar bar--light">
      <div class="brand">
        <div class="brand-top">The roll</div>
        <div class="brand-name" id="gal-title">Alumni</div>
      </div>
      <div class="chips" id="gal-chips"></div>
      <button class="nav-btn" id="gal-close" aria-label="Close">
        <span class="nav-btn-lines nav-btn-lines--x"><i></i><i></i></span>
        <span>Close</span>
      </button>
    </header>
    <div class="gal-grid" id="gal-grid"></div>
    <div class="gal-foot" id="gal-foot"></div>
  </section>

  <!-- ============================ PROFILE ============================ -->
  <section id="profile" class="screen is-hidden">
    <button class="prof-close" id="prof-close" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
    <div class="prof-wrap" id="prof-wrap"></div>
  </section>

</div>

<script>window.onerror=function(m,u,l,c,e){document.title=("ERR "+m+" :: "+((e&&e.stack)||"")).slice(0,180);};</script>
<script src="assets/js/gsap.min.js"></script>
<script src="data/alumni.js"></script>
<script src="js/app.js"></script>
</body>
</html>
